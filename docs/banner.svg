<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#336791"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8eef3"/>
    </linearGradient>
  </defs>

  <rect width="800" height="200" rx="16" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="740" cy="40" r="60" fill="#ffffff" opacity="0.05"/>
  <circle cx="60" cy="170" r="80" fill="#ffffff" opacity="0.05"/>

  <!-- Open book icon -->
  <g transform="translate(50, 55)">
    <path d="M45 10 C 30 0, 10 0, 0 8 L 0 80 C 10 72, 30 72, 45 82 Z" fill="url(#pageGrad)" stroke="#1e3a5f" stroke-width="2"/>
    <path d="M45 10 C 60 0, 80 0, 90 8 L 90 80 C 80 72, 60 72, 45 82 Z" fill="url(#pageGrad)" stroke="#1e3a5f" stroke-width="2"/>
    <line x1="10" y1="20" x2="35" y2="24" stroke="#336791" stroke-width="2"/>
    <line x1="10" y1="32" x2="35" y2="36" stroke="#336791" stroke-width="2"/>
    <line x1="10" y1="44" x2="35" y2="48" stroke="#336791" stroke-width="2"/>
    <line x1="55" y1="24" x2="80" y2="20" stroke="#336791" stroke-width="2"/>
    <line x1="55" y1="36" x2="80" y2="32" stroke="#336791" stroke-width="2"/>
    <line x1="55" y1="48" x2="80" y2="44" stroke="#336791" stroke-width="2"/>
  </g>

  <!-- Database cylinder icon -->
  <g transform="translate(180, 60)">
    <ellipse cx="35" cy="10" rx="35" ry="10" fill="#ffffff" opacity="0.9"/>
    <path d="M0 10 L0 60 C0 66, 16 71, 35 71 C54 71, 70 66, 70 60 L70 10" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
    <ellipse cx="35" cy="35" rx="35" ry="10" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Title text -->
  <text x="290" y="95" font-family="Verdana, Geneva, sans-serif" font-size="34" font-weight="bold" fill="#ffffff">Books &amp; Authors DB</text>
  <text x="290" y="125" font-family="Verdana, Geneva, sans-serif" font-size="16" fill="#cfe0ee">PostgreSQL &#8226; Express &#8226; Node.js  —  the PEN Stack</text>

  <!-- Bottom accent line -->
  <rect x="290" y="140" width="420" height="3" rx="1.5" fill="#7fb2d9"/>
</svg>
